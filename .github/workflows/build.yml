name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile VST3, Standalone and tests
        run: cmake --build build --config Release --parallel 2
      - name: Test DSP and JUCE processor
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = 'build/L2Limiter_artefacts/Release/VST3/L2 Limiter.vst3'
          $exe = 'build/L2Limiter_artefacts/Release/Standalone/L2 Limiter.exe'
          if (!(Test-Path "$vst3/Contents/x86_64-win/L2 Limiter.vst3")) { throw 'Windows VST3 binary missing' }
          if (!(Test-Path $exe)) { throw 'Windows standalone missing' }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse $vst3 package/
          Copy-Item $exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath L2-Limiter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: L2-Limiter-Windows-x64
          path: L2-Limiter-Windows-x64.zip
          if-no-files-found: error
      - name: Publish Windows development build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "windows-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT" L2-Limiter-Windows-x64.zip --target $env:GITHUB_SHA --title "Windows VST3 - build $env:GITHUB_RUN_NUMBER" --prerelease --notes "Initial development build for Windows x64. Includes VST3 and standalone. DSP and JUCE processor tests passed on the Windows runner. ARC and shaping are original provisional implementations; DAW validation is still required."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
