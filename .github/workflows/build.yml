name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure Visual Studio x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Get-Content configure.log | Select-Object -Last 40 | ForEach-Object { Write-Output "::error::$_" }
            exit $result
          }
      - name: Compile VST3, Standalone and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object compile.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Get-Content compile.log | Select-String -Pattern 'error|fatal|LNK[0-9]+' | Select-Object -Last 30 | ForEach-Object { Write-Output "::error::$_" }
            exit $result
          }
      - name: Test DSP and JUCE processor
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = 'build/L2Limiter_artefacts/Release/VST3/L2 Limiter.vst3'
          $exe = 'build/L2Limiter_artefacts/Release/Standalone/L2 Limiter.exe'
          if (!(Test-Path "$vst3/Contents/x86_64-win/L2 Limiter.vst3")) { throw 'Windows VST3 binary missing' }
          if (!(Test-Path $exe)) { throw 'Windows standalone missing' }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse $vst3 package/
          Copy-Item $exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath L2-Limiter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: L2-Limiter-Windows-x64
          path: L2-Limiter-Windows-x64.zip
          if-no-files-found: error
      - name: Publish Windows development build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "windows-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT" L2-Limiter-Windows-x64.zip --target $env:GITHUB_SHA --title "Windows VST3 - build $env:GITHUB_RUN_NUMBER" --prerelease --notes "Hardware-style blue interface with raised faders and 25 factory presets for vocals, bass, acoustic guitar, piano and more. Includes VST3 and standalone for Windows x64. Automated DSP checks cover 480 configurations plus preset recall, quantization, attack, latency, stereo, automation and nonfinite input handling. ARC and shaping remain original implementations; exact Waves equivalence and DAW validation are not claimed."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
